<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="theme-color" content="#185F64" />

  <title>Admin · Polla Mundialista 2026</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logopequeño.png') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --amarillo: #FFD100; --amarillo-2: #F6B800; --azul: #0033A0; --azul-2: #1E55D6;
      --rojo: #E4002B; --pasto: #18A24A; --teal: #31C0CA; --teal-dark: #185F64;
      --noche: #06201d; --noche-2: #0a2a26; --panel: #0e312c; --panel-2: #123a34;
      --line: rgba(255,255,255,.1); --txt: #f2f8f4; --txt-soft: #93b3ab;
      --display: 'Anton', sans-serif; --led: 'Bebas Neue', sans-serif; --body: 'Outfit', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--body); color: var(--txt); background: var(--noche); min-height: 100vh; }
    body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: radial-gradient(circle, rgba(255,255,255,.035) 1px, transparent 1.5px); background-size: 26px 26px; }

    /* TOPBAR */
    .topbar { position: relative; z-index: 2; background: var(--noche-2); border-bottom: 1px solid var(--line); }
    .topbar::after { content: ""; display: block; height: 4px; background: linear-gradient(90deg, var(--amarillo) 0 50%, var(--azul) 50% 75%, var(--rojo) 75%); }
    .topbar__in { max-width: 1200px; margin: 0 auto; padding: 11px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand img { height: 38px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
    .brand__divider { width: 1px; height: 28px; background: var(--line); }
    .brand__tag { font-family: var(--led); letter-spacing: 1.5px; font-size: 17px; color: var(--amarillo); line-height: 1; }
    .brand__tag b { display: block; color: var(--txt); font-size: 12px; font-weight: 400; }
    .btn-back { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--txt); font-weight: 700; font-size: 13px; padding: 9px 16px; border-radius: 10px; border: 1.5px solid var(--teal); transition: all .18s ease; }
    .btn-back:hover { background: var(--teal); color: #04211a; }

    /* HERO admin */
    .am-hero { position: relative; z-index: 1; overflow: hidden; background: linear-gradient(105deg, var(--amarillo) 0 50%, transparent 50%), var(--noche-2); }
    .am-hero__jersey { position: absolute; top: 0; bottom: 0; left: 0; width: 50%; background-image: repeating-linear-gradient(105deg, rgba(0,0,0,.05) 0 2px, transparent 2px 16px); }
    .am-hero__in { position: relative; z-index: 2; max-width: 1200px; margin: 0 auto; padding: 34px 18px 30px; }
    .am-hero .kick { font-family: var(--led); letter-spacing: 3px; color: #06201d; font-size: 15px; }
    .am-hero h1 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: 1px; font-size: clamp(28px, 5vw, 44px); margin: 4px 0 0; color: #06201d; }

    .am-container { position: relative; z-index: 1; max-width: 1200px; margin: 24px auto; padding: 0 18px 70px; }

    .am-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 40px; font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 18px; }
    .am-badge.ok { background: rgba(24,162,74,.16); color: #5fe08e; border: 1px solid rgba(24,162,74,.4); }
    .am-badge.warn { background: rgba(255,209,0,.14); color: var(--amarillo); border: 1px solid rgba(255,209,0,.4); }

    /* METRICAS */
    .am-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 14px; margin-bottom: 20px; }
    .am-metric { background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 4px), #082b25; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; border-bottom: 4px solid var(--amarillo); }
    .am-metric:nth-child(2) { border-bottom-color: var(--azul-2); }
    .am-metric:nth-child(3) { border-bottom-color: var(--pasto); }
    .am-metric:nth-child(4) { border-bottom-color: var(--rojo); }
    .am-metric .label { font-size: 11px; color: var(--txt-soft); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .am-metric .value { font-family: var(--led); font-size: 48px; line-height: .9; margin-top: 6px; color: var(--amarillo); }

    /* ACCIONES */
    .am-actions { display: flex; gap: 10px; flex-wrap: wrap; background: var(--panel); padding: 16px; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 20px; }
    .am-btn { border: none; border-radius: 12px; padding: 12px 20px; font-family: var(--body); font-weight: 800; font-size: 13px; letter-spacing: .3px; cursor: pointer; color: #06201d; display: inline-flex; align-items: center; gap: 8px; transition: filter .15s ease, transform .1s ease; }
    .am-btn:hover { filter: brightness(1.08); } .am-btn:active { transform: scale(.97); }
    .am-btn:disabled { opacity: .55; cursor: not-allowed; }
    .am-btn.sync { background: var(--amarillo); }
    .am-btn.calif { background: var(--pasto); color: #fff; }
    .am-btn.refresh { background: var(--teal); }
    .am-btn.export { background: #fff; }

    /* TABLA */
    .am-card { background: var(--panel); border-radius: 18px; border: 1px solid var(--line); overflow: hidden; }
    .am-card-head { padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--line); }
    .am-card-head h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: 1px; font-size: 22px; margin: 0; color: var(--txt); }
    .am-search { border: 1.5px solid var(--line); background: #04211a; color: var(--txt); border-radius: 10px; padding: 10px 16px; font-size: 13px; min-width: 250px; font-family: var(--body); }
    .am-search::placeholder { color: var(--txt-soft); }
    .am-search:focus { outline: none; border-color: var(--amarillo); }

    .am-table { width: 100%; border-collapse: collapse; }
    .am-table th { background: #04211a; text-align: left; padding: 13px 18px; font-size: 11px; color: var(--txt-soft); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .am-table td { padding: 13px 18px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .am-table tr:hover td { background: rgba(255,255,255,.03); }
    .am-table .am-pos { font-family: var(--led); font-size: 22px; width: 64px; color: var(--txt-soft); }
    .am-table .am-pts { font-family: var(--led); font-size: 22px; color: var(--amarillo); letter-spacing: 1px; }
    .am-table tr.am-top td { background: rgba(255,209,0,.06); }
    .am-table tr.am-top .am-pos { color: var(--amarillo); }
    .am-name { font-weight: 700; }
    .am-doc { color: var(--txt-soft); font-size: 13px; }

    .am-loading, .am-empty, .am-error { padding: 50px 20px; text-align: center; color: var(--txt-soft); }
    .am-error { color: #ff7d97; }
    .am-spinner { width: 44px; height: 44px; margin: 0 auto 16px; border: 4px solid var(--line); border-top-color: var(--amarillo); border-radius: 50%; animation: amspin .8s linear infinite; }
    @keyframes amspin { to { transform: rotate(360deg); } }

    .am-toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(140px); background: #04211a; color: var(--txt); padding: 15px 26px; border-radius: 14px; font-size: 14px; font-weight: 700; box-shadow: 0 16px 40px rgba(0,0,0,.5); z-index: 9999; transition: transform .4s cubic-bezier(.2,.9,.2,1); border: 1px solid var(--line); }
    .am-toast.show { transform: translateX(-50%) translateY(0); }
    .am-toast.ok { border-left: 4px solid var(--pasto); }
    .am-toast.err { border-left: 4px solid var(--rojo); }

    @media (max-width: 640px) {
      .am-table th:nth-child(5), .am-table td:nth-child(5),
      .am-table th:nth-child(6), .am-table td:nth-child(6) { display: none; }
      .am-search { min-width: 100%; }
      .brand__tag { font-size: 15px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar__in">
      <a class="brand" href="/quesonpuntos">
        <img src="{{ url_for('static', filename='images/logopequeño.png') }}" alt="Micelu">
        <span class="brand__divider"></span>
        <span class="brand__tag">ADMIN · POLLA<b>Club de Puntos Micelu</b></span>
      </a>
      <a class="btn-back" href="/admin/auditoria"><i class="fa-solid fa-arrow-left"></i> Panel Admin</a>
    </div>
  </header>

  <section class="am-hero">
    <div class="am-hero__jersey"></div>
    <div class="am-hero__in">
      <div class="kick">◤ PANEL DE CONTROL</div>
      <h1>Polla Mundialista 2026</h1>
    </div>
  </section>

  <div class="am-container">

    <span class="am-badge warn" id="mTokenBadge"><i class="fa-solid fa-spinner fa-spin"></i> Verificando API…</span>

    <div class="am-metrics">
      <div class="am-metric"><div class="label">Partidos</div><div class="value" id="mTotalPartidos">—</div></div>
      <div class="am-metric"><div class="label">Finalizados</div><div class="value" id="mTerminados">—</div></div>
      <div class="am-metric"><div class="label">Participantes</div><div class="value" id="mParticipantes">—</div></div>
      <div class="am-metric"><div class="label">Pronósticos</div><div class="value" id="mPronosticos">—</div></div>
    </div>

    <div class="am-actions">
      <button class="am-btn sync" id="btnSincronizar"><i class="fa-solid fa-rotate"></i> Sincronizar (API)</button>
      <button class="am-btn calif" id="btnCalificar"><i class="fa-solid fa-calculator"></i> Calificar terminados</button>
      <button class="am-btn refresh" id="btnRefrescar"><i class="fa-solid fa-arrows-rotate"></i> Refrescar</button>
      <button class="am-btn export" id="btnExportar"><i class="fa-solid fa-file-csv"></i> Exportar CSV</button>
    </div>

    <div class="am-card">
      <div class="am-card-head">
        <h2><i class="fa-solid fa-ranking-star"></i> Tabla de posiciones</h2>
        <input type="text" class="am-search" id="amSearch" placeholder="Buscar por nombre o documento…">
      </div>
      <div id="amTableWrap">
        <div class="am-loading"><div class="am-spinner"></div> Cargando tabla…</div>
      </div>
    </div>
  </div>

  <div class="am-toast" id="amToast"></div>
  <script src="{{ url_for('static', filename='js/admin_mundial.js') }}"></script>
</body>

</html>
